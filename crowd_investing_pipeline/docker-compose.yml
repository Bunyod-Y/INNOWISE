version: '3.8'

services:
  # 1. MySQL (Replacing Cloud SQL - for relational user/franchise data)
  mysql:
    image: mysql:8.0
    container_name: crowd_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: crowd_invest_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpassword
    ports:
      - "3306:3306"
    networks:
      - crowd_network

  # 2. Redis (For high-speed caching of funding goals)
  redis:
    image: redis:alpine
    container_name: crowd_redis
    ports:
      - "6379:6379"
    networks:
      - crowd_network

  # 3. Apache Kafka (Official Image - Event Streaming)
  kafka:
    image: apache/kafka:3.7.0
    container_name: crowd_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "CrowdInvestClusterID123"
    networks:
      - crowd_network
  # 4. Cassandra (Replacing GCP BigTable - For immutable ledger logs)
  cassandra:
    image: cassandra:latest
    container_name: crowd_cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=CrowdCluster
    networks:
      - crowd_network

  # 5. Prometheus (Metrics Scraper)
  prometheus:
    image: prom/prometheus:latest
    container_name: crowd_prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
# ... rest of the file stays the same

  # 6. Grafana (Replacing internal BI tools)
  grafana:
    image: grafana/grafana:latest
    container_name: crowd_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - crowd_network

networks:
  crowd_network:
    driver: bridge
